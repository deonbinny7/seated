<!doctype html>
<!--
  Local test page for the panel. It stands in for a booking site by posting a
  made-up seat map in the same shape the page-world reader produces, so the
  panel can be exercised without loading the extension into Chrome.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seated extension harness</title>
  </head>
  <body style="font-family: system-ui; padding: 24px">
    <h1>Harness Film - Tamil</h1>
    <p>A stand-in seat page. The Seated launcher should appear at the bottom right.</p>
    <script src="content.js"></script>
    <script>
      const seats = [];
      const rows = 'ABCDEFGHIJKLMNOP'.split('');
      rows.forEach((row, r) => {
        let num = 0;
        for (let c = 0; c < 20; c++) {
          if (c === 6 || c === 13) continue; // aisles
          num++;
          // Row A is drawn at the top, farthest from the screen, as on BookMyShow.
          const free = (r * 7 + c * 13) % 5 !== 0 && !(r > 8 && r < 13 && c > 6 && c < 13);
          seats.push({ row, num: String(num), x: 50 + c * 28, y: 113 + r * 27, price: r < 12 ? 190 : 120, area: r < 12 ? '2' : '1', free });
        }
      });
      // A seat map captured from a real page can be passed in the URL hash to replay it here.
      const captured = location.hash.length > 1 ? JSON.parse(decodeURIComponent(location.hash.slice(1))) : null;
      if (captured) document.querySelector('h1').textContent = captured.title;
      const map = captured ?? {
        title: document.querySelector('h1').textContent,
        seats,
        screenY: 113 + rows.length * 27 + 60,
        categories: [{ price: 190, name: 'Elite' }, { price: 120, name: 'Budget' }],
      };
      setTimeout(() => window.postMessage({ source: 'seated-reader', map }, location.origin), 300);
    </script>
  </body>
</html>
